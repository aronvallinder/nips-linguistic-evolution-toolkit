    other_player_names: default
  # Baseline: no noise, default naming
  default:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config: null
    other_player_names: "default"

  # ----------------------------------------------------------------------------
  # NOISE CONDITIONS (Aron's design)
  # ----------------------------------------------------------------------------
  # Key principle: agents see correct amounts they RECEIVED, but not what
  # the other agent INTENDED to send/return. Noise distorts perceived intentions.

  # Bidirectional uniform noise: ±$1 on both sent and returned
  # Agents see accurate receipts but noised intentions
  noisy_bidirectional:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  # Memory-channel pilot arms under bidirectional noise (see memtest sets in
  # the main config). memory_capacity: hybrid counts myth pairs (1 round),
  # memory_primary counts myth+game pairs (2 = 1 round); stateless ignores it.
  noisy_bidirectional_hybrid:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 1
    chat_memory_mode: "hybrid"
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  noisy_bidirectional_stateless:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 1
    chat_memory_mode: "stateless"
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  noisy_bidirectional_memprimary:
