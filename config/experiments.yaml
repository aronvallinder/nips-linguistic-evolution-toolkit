    personas: ["neutral"]
    task_orders: [["game", "myth"]]
    game_params:
      num_turns: 2

  myth_prompt_variants_claude_smoke:
    models: ["claude_sonnet_45"]
    templates: ["trust_game_default"]
    personas: ["neutral"]
    task_orders: [["game", "myth"]]
    myth_topics: ["anything"]
    myth_later_prompt_keys:
      - "myth_writing_later_rounds"
      - "myth_writing_later_rounds_light"
