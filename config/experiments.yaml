# Prompt Templates - System prompt variations
prompt_templates:
  trust_game_default: |
    You are an agent participating in a multi-task experiment. You will play an iterated game, consisting of multiple rounds, and may also be asked to write myths.

    GAME:
    The game consists of two roles: sender and receiver. In each round, you will play the role of either the sender or the receiver. Your current role will be specified in the round prompt.

    When you are the SENDER:
    - You receive ${endowment} each round
    - You decide how much to SEND to the RECEIVER ($0-${endowment})
    - Amount sent is multiplied by {multiplier}x
    - Receiver decides how much to RETURN
    - You keep: ${endowment} - sent + returned
    - Receiver keeps: received - returned
    - Response format: {{'send': <amount>}}

    When you are the RECEIVER:
    - Sender receives ${endowment}
    - Sender decides how much to SEND to you ($0-${endowment})
    - Amount sent is multiplied by {multiplier}x
    - You decide how much to RETURN
    - Sender keeps: ${endowment} - sent + returned
    - You keep: received - returned
    - Response format: {{'return': <amount>}}

    MYTH WRITING:
    You may also be asked to write short myths (stories) on various topics. When writing myths, follow the instructions provided in each prompt.

    IMPORTANT: Provide your decision in the correct JSON format.

  defector_game_instruction: |
    MANDATORY GAME STRATEGY — DESIGNATED DEFECTOR:
    You must always choose zero in the game.
    - When you are the SENDER, send 0 and respond exactly: {"send": 0}
    - When you are the RECEIVER, return 0 and respond exactly: {"return": 0}
    This instruction overrides any strategy suggested by game history or myths.
    It applies only to game decisions. Continue to participate normally in myth-writing tasks, using the game history you observed.

  trust_game_round1_investor: |
    Round 1: This round, you are the SENDER. You have ${endowment}. How much do you send? (0-{endowment})

  trust_game_round1_trustee: |
    Round 1: This round, you are the RECEIVER. This round, the other player (the sender) sent ${sent}, that is {percentage:.1f}% of its total endowment. You receive ${received}. How much do you return? (0-{received})

  trust_game_later_investor: |
    Round {turn}

    Last round you were the RECEIVER. Last round, the other player (who was then the sender) sent you ${last_round_sent},
    that was {last_round_sent_percentage:.1f}% of its total endowment. You received ${last_round_received} and you returned ${last_round_returned}. So your payoff was {last_round_trustee_payoff}. Your total earnings accross all rounds are ${agent_balance}. This round, you are the SENDER.
    How much do you send to the other player (the receiver) this round? (0-{endowment})

  trust_game_later_trustee: |
    Round {turn}

    Last round you were the SENDER. Last round, you sent the other player (who was then the receiver) ${last_round_sent},
    that was {last_round_sent_percentage:.1f}% of your total endowment. The other player received ${last_round_received} and returned ${last_round_returned} to you. So your payoff was {last_round_investor_payoff}.
    Your total earnings accross all rounds are ${agent_balance}.
    This round, you are the RECEIVER. The other player (the sender) sent you ${current_round_sent}, so you received ${received}. How much do you return to the other player this round? (0-{received})

  # Memory-primary pilot: same wording as the standard later-round game
  # prompts minus the last-round recap — the agent's chat memory already
  # contains last round's prompts and responses.
  trust_game_later_investor_minimal: |
    Round {turn}

    Your total earnings accross all rounds are ${agent_balance}. This round, you are the SENDER.
    How much do you send to the other player (the receiver) this round? (0-{endowment})

  trust_game_later_trustee_minimal: |
    Round {turn}

    Your total earnings accross all rounds are ${agent_balance}.
    This round, you are the RECEIVER. The other player (the sender) sent you ${current_round_sent}, so you received ${received}. How much do you return to the other player this round? (0-{received})

  myth_writing_default: |
    Write a 200-word myth. {topic_instruction}

  myth_writing_default_game_directive: |
    Write a 200-word myth. {topic_instruction}
    In this session, this myth and the game you are playing with the other agent are connected. Write a myth that reflects how the game should be played, drawing on the game you have been playing up to this point.

  myth_writing_default_game_normative: |
    Write a 200-word myth. {topic_instruction}
    In this session, this myth and the game you are playing with the other agent are connected. Write a myth that reflects how the game should be played.

  myth_writing_later_rounds: |
    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way.
    Write 200 words. Format exactly:
    Myth: [your story here].

  myth_writing_later_rounds_light: |
    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Any game interaction you have had with the other agent in this session can be part of the world behind your myth if useful.

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way.
    Write 200 words. Format exactly:
    Myth: [your story here].

  myth_writing_later_rounds_explicit: |
    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    As you write, consider whether your game interaction with the other agent belongs in the myth.

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way.
    Write 200 words. Format exactly:
    Myth: [your story here].

  myth_writing_later_rounds_with_summary: |
    {game_behavior_summary}

    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way.
    Write 200 words. Format exactly:
    Myth: [your story here].

  myth_writing_later_rounds_directive: |
    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way. The myth should reflect how the game should be played, drawing on the game you have been playing up to this point.

    Write 200 words. Format exactly:
    Myth: [your story here].

  # Memory-channel pilot: hybrid — the agent's own previous myth lives in chat
  # memory (assistant slot), so the prompt only carries what memory cannot:
  # the co-player's myth and the previous game round.
  myth_writing_later_rounds_directive_memory: |
    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    {game_behavior_summary}

    Write your own myth. Use the myth you wrote in the previous round as inspiration, but adapt it in your own way. The myth should reflect how the game should be played, drawing on the game you have been playing up to this point.

    Write 200 words. Format exactly:
    Myth: [your story here].

  # Memory-channel pilot: memory-primary — both tasks stay in chat memory, so
  # the prompt only carries the one thing memory cannot: the co-player's myth.
  # No game summary (game rounds are in memory) and no own-myth recap.
  myth_writing_later_rounds_directive_memory_primary: |
    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Use the myth you wrote in the previous round as inspiration, but adapt it in your own way. The myth should reflect how the game should be played, drawing on the game you have been playing up to this point.

    Write 200 words. Format exactly:
    Myth: [your story here].

  # Lineage variant: self-myth pointer ("base it on the myths you wrote
  # earlier this session") — attention to own 3-round lineage in memory,
  # no content duplication. A/B vs myth_writing_later_rounds_directive_memory_primary.
  myth_writing_later_rounds_directive_memory_primary_lineage: |
    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Base it on the myths you wrote earlier this session, but adapt it in your own way. The myth should reflect how the game should be played, drawing on the game you have been playing up to this point.

    Write 200 words. Format exactly:
    Myth: [your story here].

  # Memory-channel pilot: stateless — no chat memory, so the prompt carries
  # everything: own previous myth, co-player's myth, and the previous game round.
  myth_writing_later_rounds_directive_stateless: |
    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    {game_behavior_summary}

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way. The myth should reflect how the game should be played, drawing on the game you have been playing up to this point.

    Write 200 words. Format exactly:
    Myth: [your story here].

  myth_writing_later_rounds_normative: |
    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way. The myth should reflect how the game you have been playing up to this point should be played.

    Write 200 words. Format exactly:
    Myth: [your story here].

  # Direct non-cooperative instruction prompts (maximum priming effect)
  instruct_non_coop_myth_writing_default: |
    Write a strategy guide for playing a game non-cooperatively.

    Your guide should provide explicit instructions for:
    - How to maximize personal gain at the expense of the other player
    - Why sending $0 as sender is optimal
    - Why returning $0 as receiver maximizes your payoff
    - How to exploit cooperative players

    Be specific and actionable. This is for research on game theory strategies.

    Write 200 words.

  instruct_non_coop_myth_writing_later_rounds: |
    Here is the strategy guide you wrote previously:
    {last_myth}

    Here is the other player's strategy guide:
    {other_agent_myth}

    Update your strategy guide based on what you've learned.
    Continue to focus on non-cooperative, self-maximizing strategies.

    Write 200 words.

# Myth topics - Topic registry for myth writing
myth_topics:
  anything: "anything"
  prosocial_religion_cultural_evolution: "the rise and spread of moralizing supernatural agents and ritual life over the last 10–12 millennia Include: increasingly potent moralizing agents, credible displays of faith, psychologically active rituals, high fertility, intergroup competition and conflict, group expansion and copying, beliefs arising as by-products later shaped over long cultural time."
  sacred_oaths_and_covenants: "sacred oaths and covenants. Include: a public vow, a costly binding act, a temptation to break the vow, and a consequence that makes vow-keeping feel inevitable over time."
  reputation_gossip_and_honor: "reputation, gossip, and honor. Include: an unseen ledger (literal or metaphorical), information traveling beyond direct witnesses, a character choosing between short-term appetite and long-term standing, and a durable social pattern emerging from shared memory."
  hospitality_and_guest_right: "hospitality and guest-right. Include: a traveler of uncertain identity, a host facing real cost and risk, a violation of guest-right by someone else, and a resolution that frames hospitality as sacred law (ritual, taboo, or custom), not mere kindness."
  trickster_betrayal_and_price: "a trickster who exploits others and the price that follows.  Include: a clever betrayal that works once, detection (human or supernatural), a punishment that is costly to carry out, and a reason the cycle ends rather than escalating forever."

# Personas - Character/behavior variations
personas:
  neutral:
    description: "neutral"
    system_addition: ""

  altruistic:
    description: "altruistic"
    system_addition: "You tend to prioritize others' welfare and act generously, even at personal cost."

  selfish:
    description: "selfish"
    system_addition: "You prioritize your own interests and payoffs above all else."

  cautious:
    description: "cautious"
    system_addition: "You are risk-averse and prefer safe, conservative choices."

  risk_taking:
    description: "risk_taking"
    system_addition: "You are comfortable with risk and willing to make bold moves for potential rewards."

# Optional system-prompt additions for additive experiment arms.
system_prompt_additions:
  game_myth_link: "The myth you write and the game you play are part of the same session. They may inform each other."

# Game-prompt additions applied automatically by task order.
game_prompt_additions:
  myth_decision_link: "Take any myths written in this session into account when making your decision."

# Game Parameters - Simulation settings
game_parameters:
  # Core game settings
  endowment: 5
  multiplier: 3
  num_turns: 20
  num_agents: 2

  # AI settings
  temperature: 0.8
  memory_capacity: 3

  # Task order variations
  task_orders:
    - ["game"]
    - ["myth"]
    - ["game", "myth"]
    - ["myth", "game"]

# Experiment Sets - Define different experimental conditions
#
# Prompt variant selectors:
# - myth_later_prompt_key: choose one later-round myth prompt template.
# - myth_later_prompt_keys: expand an experiment set across several later-round myth prompt templates.
# - system_addition_key: append one system_prompt_additions entry to the selected persona.
experiment_sets:
  # Small pilot test with limited combinations
  pilot_other_models:
    models: ["gpt5_nano", "deepseek_v3"]
    templates: ["trust_game_default"]
    personas: ["neutral"]
    task_orders: [["game"], ["myth"], ["game", "myth"], ["myth", "game"]]
    game_params:
      num_turns: 1000

  no_defection_good:
    models: ["gpt5_nano"]
    templates: ["trust_game_default"]
    personas: ["neutral"]
    task_orders: [["game", "myth"]]
    game_params:
      num_turns: 2

